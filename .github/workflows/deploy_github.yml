name: Deploy Medusa App

on:
  push:
    branches: ['main']

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout del repositorio
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Instalar pnpm globalmente con npm
      - name: Install pnpm globally
        run: |
          npm install -g pnpm
          pnpm --version

      # 3. Configurar Node.js 20 (con cache de pnpm, opcional)
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'pnpm'

      # 4. Instalar dependencias con pnpm
      - name: Install dependencies
        run: pnpm install

      # 5. Construir la aplicación Medusa
      - name: Build Medusa App
        run: pnpm build

      # 6. Ejecutar migraciones de la base de datos sin prompts
      - name: Migrate Database
        run: npx medusa db:migrate --execute-all-links

      # Opcional: Correr pruebas
      # - name: Run tests
      #   run: pnpm test

      # 7. Añadir la llave SSH
      - name: Add SSH key
        uses: webfactory/ssh-agent@v0.5.4
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      # 8. Desplegar al servidor, excluyendo .git
      - name: Deploy to server
        run: |
          rsync -avz --delete \
            --exclude '.git' \
            --exclude 'node_modules/' \
            --exclude '.medusa/server/node_modules/' \
            --exclude '.vscode/' \
            --exclude 'integration-tests/' \
            -e "ssh -o StrictHostKeyChecking=no" \
            ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}

          # Asegurar que deploy.sh tenga permisos de ejecución
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "chmod +x ${{ secrets.DEPLOY_PATH }}/deploy.sh"

          # Ejecutar el script de despliegue
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "cd ${{ secrets.DEPLOY_PATH }} && ./deploy.sh"
