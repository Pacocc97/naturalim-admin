name: Deploy Medusa App

on:
  push:
    branches: ['main']

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9 # Especifica la versión de pnpm que deseas usar

      - name: Install dependencies
        run: pnpm install

      - name: Build Medusa App
        run: pnpm build
        # Esto generará el build productivo en `.medusa/server`

      # Opcional: Correr pruebas
      # - name: Run tests
      #   run: pnpm test

      - name: Add SSH key
        uses: webfactory/ssh-agent@v0.5.4
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Deploy to server
        run: |
          # Sincroniza el código completo al servidor, excluyendo el directorio .git
          rsync -avz --delete \
            --exclude '.git' \
            -e "ssh -o StrictHostKeyChecking=no" \
            ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}

          # Ejecuta el script de despliegue que hará la migración, build final, y arranque con pm2
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "cd ${{ secrets.DEPLOY_PATH }} && ./deploy.sh"
